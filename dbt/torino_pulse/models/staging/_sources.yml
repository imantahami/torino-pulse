version: 2

sources:
  - name: raw
    # CI points this at the schema holding the fixture seeds.
    schema: "{{ env_var('DBT_RAW_SCHEMA', 'public') }}"
    tables:
      - name: raw_vehicle_positions
      - name: raw_trip_updates
      - name: raw_alerts
      - name: raw_weather
      - name: gtfs_routes
      - name: gtfs_stops
      - name: gtfs_trips
      - name: gtfs_routes_history
      - name: gtfs_trips_history
      - name: gtfs_agency
      - name: gtfs_calendar

models:
  - name: stg_vehicle_positions
    description: "Vehicle position snapshots from GTT, with invalid (0,0) GPS coordinates removed."
    columns:
      - name: id
        description: "Primary key from the raw table."
        data_tests: [unique, not_null]
      - name: vehicle_id
        data_tests: [not_null]
      - name: latitude
        data_tests: [not_null]
      - name: longitude
        data_tests: [not_null]

  - name: stg_weather
    description: "Turin weather observations from Open-Meteo, deduplicated to the most recent fetch per observation time."
    columns:
      - name: observed_at
        description: "Observation timestamp reported by the API. Unique after deduplication."
        data_tests: [unique, not_null]
      - name: temperature_c
        data_tests: [not_null]

  - name: stg_trip_updates
    description: >
      Stop-level delay predictions, enriched with route_id resolved from static GTFS
      (the realtime feed leaves it empty). Every observation is kept, not deduplicated —
      filter on is_latest_observation for the final prediction per trip/stop,
      or use delay_change_seconds to study how predictions drift over time.
    columns:
      - name: trip_id
        data_tests: [not_null]
      - name: route_id
        description: >
          Resolved via join to stg_gtfs_trips (the GTFS history table). Null means the
          trip_id was never seen in a captured feed. Observations recorded before
          the history table existed (Aug to early Nov 2026) are largely unresolved
          and cannot be recovered, so this test only covers rows from the cutover onward.
        data_tests:
          - not_null:
              config:
                where: "fetched_at >= '2026-11-03'"
      - name: stop_sequence
        data_tests: [not_null]
      - name: delay_source
        description: >
          Where arrival_delay_seconds comes from: 'reported' (GTT sent a delay),
          'derived_from_time' (GTT sent an absolute arrival time; delay = predicted
          minus scheduled) or 'unknown' (no usable delay, arrival_delay_seconds is null).
        data_tests:
          - not_null
          - accepted_values:
              values: ['reported', 'derived_from_time', 'unknown']
      - name: is_latest_observation
        data_tests: [not_null]
      - name: observation_number
        data_tests: [not_null]

  - name: stg_alerts
    description: >
      Service alerts collapsed to one row per (alert, affected entity),
      with first_seen_at / last_seen_at describing the observation window.
    columns:
      - name: alert_id
        data_tests: [not_null]
      - name: entity_type
        data_tests:
          - not_null
          - accepted_values:
              values: ['route', 'stop', 'trip', 'agency', 'unknown']
      - name: effect
        data_tests: [not_null]

  - name: stg_gtfs_trips
    description: >
      One row per trip_id, resolved to the route it was most recently seen on, built
      from the never-dropped gtfs_trips_history table so realtime observations still
      resolve after GTT rotates its trip_ids.
    columns:
      - name: trip_id
        data_tests: [unique, not_null]
      - name: route_id
        data_tests: [not_null]

  - name: stg_routes
    description: "GTT route reference data (from gtfs_routes_history, so retired routes stay resolvable) with human-readable names and derived mode/service-area classification."
    columns:
      - name: route_id
        data_tests: [unique, not_null]
      - name: route_short_name
        data_tests: [not_null]
      - name: route_mode
        data_tests:
          - accepted_values:
              values: ['tram', 'metro', 'rail', 'bus', 'ferry', 'cable_tram', 'aerial_lift', 'funicular', 'other']

  - name: stg_stops
    description: "GTT stop reference data, filtered to stops with valid coordinates."
    columns:
      - name: stop_id
        data_tests: [unique, not_null]
      - name: stop_name
        data_tests: [not_null]
      - name: latitude
        data_tests: [not_null]
      - name: longitude
        data_tests: [not_null]