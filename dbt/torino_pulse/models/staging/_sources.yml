version: 2

sources:
  - name: raw
    schema: public
    tables:
      - name: raw_vehicle_positions
      - name: raw_weather

models:
  - name: stg_vehicle_positions
    description: "Cleaned vehicle position data from GTT, filtered to remove invalid (0,0) coordinates"
    columns:
      - name: id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: vehicle_id
        description: "GTT vehicle identifier"
        tests:
          - not_null
      - name: latitude
        tests:
          - not_null
      - name: longitude
        tests:
          - not_null

  - name: stg_weather
    description: "Deduplicated weather observations for Turin from Open-Meteo, keeping the latest fetch per observation time"
    columns:
      - name: observed_at
        description: "Timestamp of the weather observation"
        tests:
          - unique
          - not_null
      - name: temperature_c
        tests:
          - not_null